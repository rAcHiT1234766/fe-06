<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DashKit in plain HTML</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>DashKit in plain HTML</h1>
    <p>
      No framework and no build step: one script tag, one element and a few lines of JavaScript.
    </p>
    <p id="filters" aria-live="polite">Filters: none</p>

    <dashkit-dashboard api-url="http://localhost:4000" dashboard-id="overview"></dashkit-dashboard>

    <script src="/dashkit.js"></script>
    <script>
      const dashboard = document.querySelector('dashkit-dashboard');

      // A real page asks its own backend for a token for the signed-in user. The demo API hands
      // one out to anyone, so it stands in for that backend here.
      dashboard.getToken = () =>
        fetch('http://localhost:4000/auth/demo-token', {
          method: 'POST',
          body: JSON.stringify({ userId: 'asha' }),
        })
          .then((response) => response.json())
          .then((body) => body.token);

      dashboard.addEventListener('dashkit:filterchange', (event) => {
        const filters = event.detail.map(
          ({ field, values }) => `${field} is ${values.join(' or ')}`,
        );
        document.getElementById('filters').textContent = `Filters: ${filters.join(', ') || 'none'}`;
      });
    </script>
  </body>
</html>
